<!DOCTYPE html>
<html class="dark" lang="lo">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<meta content="#1f0f0d" name="theme-color"/>
<title>ປັບແຕ່ງເມນູ | Velvet & Roast Cafe</title>
<link href="assets/images/logo.svg" rel="icon" type="image/svg+xml"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<!-- Noto Sans Lao added so Lao script renders correctly (Plus Jakarta Sans / Space Grotesk have no Lao glyphs) -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;family=Noto+Sans+Lao:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/js/tailwind-config.js"></script>
<link href="assets/css/app.css" rel="stylesheet"/>
</head>
<body class="bg-surface text-on-surface flex flex-col min-h-screen selection:bg-primary-container selection:text-on-primary-container">
<header class="fixed top-0 inset-x-0 z-50 bg-surface-container-lowest/85 backdrop-blur-xl shadow-[0_4px_20px_rgba(0,0,0,0.4)] pt-safe"><div class="h-16 max-w-[480px] mx-auto px-margin flex items-center justify-between gap-space-sm">
<div class="flex items-center gap-space-xs min-w-0">
<a aria-label="ກັບໄປເມນູ" class="w-11 h-11 flex items-center justify-center rounded-full bg-card-elevated text-on-surface hover:text-text-primary transition-colors min-w-[44px] min-h-[44px]" href="menu.html"><span class="material-symbols-outlined text-[20px]">arrow_back</span></a>
<img alt="Velvet &amp; Roast Cafe Logo" class="h-8 w-8 object-contain" src="assets/images/logo.svg"/>
<h1 class="font-headline-sm text-headline-sm text-text-primary tracking-tight truncate">ປັບແຕ່ງເມນູ</h1>
</div>
<div class="flex items-center gap-space-xs shrink-0">
<a aria-label="ໄປທີ່ກະຕ່າ" class="relative w-11 h-11 flex items-center justify-center rounded-full text-on-surface-variant hover:text-text-primary transition-colors" href="cart.html"><span class="material-symbols-outlined text-[22px]">local_mall</span><span class="absolute top-1 right-0 min-w-[18px] h-[18px] px-1 rounded-full bg-primary-container text-on-primary-container font-label-sm text-label-sm flex items-center justify-center leading-none" data-cart-badge style="display:none">0</span></a>
</div>
</div></header>
<main class="flex flex-col relative w-full max-w-[480px] mx-auto pt-16 pb-safe bg-surface min-h-screen"><div class="flex flex-col w-full pb-28">
<div class="relative w-full aspect-[4/3] max-h-[300px] overflow-hidden rounded-b-xl shadow-xl">
<img alt="" class="w-full h-full object-cover" id="heroImg" src="assets/images/latte.jpg"/>
<div class="absolute inset-0 bg-gradient-to-t from-surface-container via-surface-container/40 to-transparent"></div>
<div class="absolute top-4 left-4 bg-surface-container-lowest/80 backdrop-blur-md px-space-sm py-1 rounded-full flex items-center gap-1.5 shadow-md">
<span class="w-2 h-2 rounded-full bg-primary-container animate-pulse"></span>
<span class="font-label-sm text-label-sm text-secondary uppercase tracking-wider" id="heroTag">Signature</span>
</div>
<button aria-label="Favorite" class="absolute top-4 right-4 w-11 h-11 rounded-full bg-surface-container-lowest/80 backdrop-blur-md flex items-center justify-center text-text-primary shadow-lg transition-transform active:scale-90" id="favorite-btn" type="button"><span class="material-symbols-outlined text-[20px] transition-colors" id="fav-icon">favorite</span></button>
<div class="absolute bottom-3 inset-x-0 px-margin flex flex-col gap-0.5">
<div class="flex items-baseline justify-between gap-2">
<h2 class="font-headline-md text-headline-md text-text-primary tracking-tight" id="heroName"></h2>
<span class="font-label-sm text-label-sm text-primary-fixed bg-wine-dark/70 px-2 py-0.5 rounded-full font-semibold shrink-0" id="heroEn"></span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant line-clamp-1" id="heroDesc"></p>
</div>
</div>

<div class="px-margin pt-space-md flex flex-col gap-space-lg">
<section class="flex flex-col gap-space-xs" id="styleSection" style="display:none"></section>
<section class="flex flex-col gap-space-xs" id="sizeSection" style="display:none"></section>
<section class="flex flex-col gap-space-xs" id="sweetSection" style="display:none"></section>

<section class="flex flex-col gap-space-xs">
<label class="font-label-lg text-label-lg text-text-primary flex items-center gap-1.5" for="order-note">
<span class="material-symbols-outlined text-[18px] text-primary">edit_note</span>
ໝາຍເຫດເພີ່ມເຕີມ (Special Instructions)
</label>
<textarea class="w-full bg-graphite-surface text-text-primary font-body-md text-body-md rounded-xl p-space-sm placeholder:text-text-dim focus:outline-none focus:bg-surface-container-high transition-colors resize-none shadow-inner" id="order-note" placeholder="ຕົວຢ່າງ: ຂໍນົມ oats, ແຍກນ້ຳກ້ອນ, ບໍ່ໃສ່ຝາ..." rows="2"></textarea>
</section>

<section class="flex items-center justify-between p-space-sm bg-card-elevated rounded-xl shadow-sm">
<div class="flex flex-col">
<span class="font-headline-sm text-headline-sm text-text-primary">ຈຳນວນ</span>
<span class="font-body-sm text-body-sm text-text-dim" id="qtyHint">ລະບຸຈຳນວນ</span>
</div>
<div class="flex items-center gap-space-sm bg-surface-container-lowest px-2 py-1.5 rounded-full">
<button aria-label="Decrease quantity" class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-text-primary active:scale-95 transition-transform disabled:opacity-40 disabled:pointer-events-none" disabled id="qty-minus" type="button"><span class="material-symbols-outlined text-[18px]">remove</span></button>
<span class="font-headline-sm text-headline-sm text-text-primary w-6 text-center font-bold" id="qty-display">1</span>
<button aria-label="Increase quantity" class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container active:scale-95 transition-transform shadow-md" id="qty-plus" type="button"><span class="material-symbols-outlined text-[18px]">add</span></button>
</div>
</section>
</div>

<div class="fixed bottom-0 inset-x-0 z-40 bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_-8px_24px_rgba(0,0,0,0.5)] pb-safe">
<div class="max-w-[480px] mx-auto px-margin py-3 flex items-center gap-space-sm">
<button class="w-full py-4 px-margin rounded-full bg-gradient-to-r from-primary-container to-burgundy-deep text-on-primary-container font-headline-sm text-headline-sm flex items-center justify-center gap-2 shadow-[0_4px_20px_rgba(220,38,38,0.4)] active:scale-[0.98] transition-transform cursor-pointer" id="add-to-cart-btn" type="button">
<span class="material-symbols-outlined text-[20px]">shopping_bag</span>
<span>ເພີ່ມໃສ່ກະຕ່າ</span>
<span class="w-1.5 h-1.5 rounded-full bg-on-primary-container/60"></span>
<span class="font-price-display text-price-display font-bold" id="btn-total-display"></span>
</button>
</div>
</div>
</div></main>
<script src="assets/js/store.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/customize.js"></script>
</body>
</html>
